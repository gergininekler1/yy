<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Anubis</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ee;--card:#fff;--tx:#1d1b18;--mu:#7a746a;--ac:#b8892b;--bd:#e5dfd3;--rd:#d64545;--or:#e08a1e;--gr:#3f9b5f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--card:#201d17;--tx:#f1ece2;--mu:#a39b8c;--ac:#d9a840;--bd:#352f25;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{margin:4px 0 12px;font-size:26px;letter-spacing:1px}h1 span{color:var(--ac)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin:22px 0 8px}
input,textarea,button{font:inherit;color:var(--tx)}
input[type=text],input[type=url],textarea,input:not([type]){width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
textarea{min-height:170px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 4px;text-align:center;cursor:pointer;font-size:13px}
.tile b{display:block;font-size:26px;font-weight:400}
.tile.p{border-color:var(--ac)}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.row small{color:var(--mu);display:block}.row img{width:34px;height:48px;object-fit:cover;border-radius:4px}
.ic{font-size:22px}.grow{flex:1;min-width:0}.grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.late{color:var(--rd);border-color:var(--rd)}.soon{color:var(--or);border-color:var(--or)}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 5px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.a{background:var(--ac);border-color:var(--ac);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:99px;background:var(--card);cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.star{font-size:28px;cursor:pointer;color:var(--bd)}.star.on{color:var(--ac)}
.prev{width:60px;height:86px;object-fit:cover;border-radius:6px;margin-top:8px}
.pg{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.pg i{display:block;height:100%;background:var(--gr)}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--gr)}.task.d .t{text-decoration:line-through;color:var(--mu)}
.add{display:flex;gap:8px;margin-top:10px}.add input:last-of-type{max-width:110px}
.x{color:var(--mu);cursor:pointer;padding:0 6px}
.empty{color:var(--mu);font-size:14px;padding:6px 0}
.pg2{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}.pg2 span{color:var(--mu);font-size:14px}
.btn:disabled{opacity:.35}.sync{font-size:12px;color:var(--mu);text-align:center;margin-top:22px}.ok{color:var(--gr)}
.save{width:100%;margin-top:22px;padding:14px;font-size:17px}

:root{--sh:0 1px 2px rgba(60,40,10,.06),0 10px 26px -14px rgba(60,40,10,.28);--ac2:#e6bc60}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 16%,transparent),transparent 260px),var(--bg)}
main{padding:22px 16px 48px}
h1{font-size:30px;font-weight:700}
.tile{border:0;border-radius:20px;padding:16px 4px 13px;box-shadow:var(--sh);transition:transform .12s}
.tile:active{transform:scale(.95)}
.tile b{width:46px;height:46px;line-height:46px;margin:0 auto 8px;border-radius:15px;background:color-mix(in srgb,var(--ac) 15%,transparent);font-size:23px}
.tile.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600}.tile.p b{background:rgba(255,255,255,.28)}
.row{border:0;border-radius:16px;box-shadow:var(--sh);padding:12px 14px}
input[type=text],input[type=url],textarea,input:not([type]){border-color:transparent;border-radius:14px;box-shadow:var(--sh);padding:13px 14px}
.btn{border:0;border-radius:12px;box-shadow:var(--sh)}.btn.a{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.chip{border:0;box-shadow:var(--sh)}.chip.on{background:var(--ac);color:#fff}
.due{border-radius:99px;font-weight:500}

body,input,textarea,button{font-family:"JetBrains Mono","Lucida Console","Cascadia Mono",Consolas,"Courier New",monospace}
body,input,textarea,button{font-size:15px}
h1{letter-spacing:3px;text-transform:uppercase;font-weight:400}h2{letter-spacing:1.5px}

:root{--bo:rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bo:rgba(255,255,255,.28)}}
.row,.tile,textarea,input[type=text],input[type=url],input:not([type]){border:1px solid var(--bo);box-shadow:none}
input[type=text],input[type=url],textarea,input:not([type]){padding:10px 12px;border-radius:12px}
.row{padding:9px 12px;border-radius:14px}
.tile{padding:12px 2px 10px;font-size:12px;border-radius:16px}
.tile b{width:36px;height:36px;line-height:36px;font-size:19px;border-radius:12px;margin-bottom:6px}
.btn{padding:6px 12px;font-size:13px;border-radius:9px;box-shadow:none;border:1px solid var(--bo);background:transparent}
.btn.a{border-color:transparent}
.save{width:auto;display:block;margin:20px 0 0 auto;padding:8px 18px;font-size:13px}
.chip{padding:4px 10px;font-size:12px;border:1px solid var(--bo);box-shadow:none}.chip.on{border-color:var(--ac)}
.star{font-size:22px}.bar{gap:6px}h1{font-size:24px}.pg2 .btn{padding:3px 12px}

.blk{border:1px solid var(--bo);border-radius:18px;padding:12px 12px 6px;margin-bottom:14px;background:color-mix(in srgb,var(--card) 55%,transparent)}
.blk>h2{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--bo)}
.lb{display:block;color:var(--mu);font-size:11px;margin:2px 2px 4px}
.top{display:flex;justify-content:space-between;align-items:center}.top .btn{padding:4px 10px;font-size:12px}
.sync{margin-top:14px}.due{font-variant-numeric:tabular-nums}
.tb{display:flex;gap:6px}#qs{margin-bottom:12px}
.nt{cursor:default}.acts{display:flex;flex:none}.acts .x{padding:6px 7px;font-size:15px}.pp{display:flex;gap:8px;align-items:center}.pp input{flex:1;min-width:0}
</style></head><body><main id="app"></main>
<script>
const T={
blog:{n:"Blog notu",i:"💡",tt:"fikir",f:[["fikir","Ana fikir (tek cümle)","text"],["kw","Anahtar kelimeler","text"],["not","Notun","area"]]},
kitap:{n:"Kitap",i:"📖",tt:"ad",f:[["ad","Kitap adı","text"],["yazar","Yazar","text"],["puan","Puan","stars"],["sayfa","Sayfa (kaldığım / toplam)","pages"],["alinti","Alıntılar","quotes"],["not","Notun","area"]]},
is:{n:"İş",i:"💼",tt:"baslik",f:[["baslik","Başlık","text"],["tur","Tür","chips"],["not","Notun","area"]]},
etkinlik:{n:"Etkinlik",i:"📅",tt:"ad",f:[["ad","Etkinlik adı","text"],["tarih","Tarih","text"],["yer","Yer","text"],["kisiler","Katılımcılar","text"],["yap","Yapılacaklar","area"]]},
strateji:{n:"Strateji ve Planlama",i:"🎯",tt:"hedef",f:[["hedef","Strateji / proje adı","text"],["adim","Adımlar","area"],["plan","Planlarım","area"],["links","Bağlantılı projeler","links"]]},
proje:{n:"Proje",i:"🚀",tt:"ad",f:[["ad","Proje adı","text"],["tasks","Görevler","tasks"]]}};
const TURLER=["Tecrübe","Kritik","Kural","Sınav"],PER=5;
let S=[],cur=null,q="",pg=0,ap=0,af="",syncT="Yalnızca bu cihaz",DB=null,pt=null,LT=0;
try{S=JSON.parse(localStorage.getItem("anubis")||"[]");LT=+localStorage.getItem("anubis_t")||0}catch(e){S=[]}
function save(){LT=Date.now();try{localStorage.setItem("anubis",JSON.stringify(S));localStorage.setItem("anubis_t",LT)}catch(e){}
}
async function push(){try{await DB.set({s:JSON.stringify(S),t:LT});syncT="☁ Senkronize"}catch(e){syncT="Senkron hatası"}upd()}
function upd(){const e=document.getElementById("sy");if(e)e.textContent=syncT}
async function pull(){if(!DB)return;try{const sn=await DB.get();const r=sn.exists&&sn.data();
if(r&&r.t>LT&&!cur){S=JSON.parse(r.s);LT=r.t;try{localStorage.setItem("anubis",r.s);localStorage.setItem("anubis_t",LT)}catch(e){}syncT="☁ Senkronize";home()}
else if(!r||LT>r.t)await push();else{syncT="☁ Senkronize";upd()}}catch(e){syncT="Senkron hatası";upd()}}
async function initSync(){try{if(!window.claude)return;const u=await claude.use("user"),d=await claude.use("db");if(!u||!d)return;
const id=await u.id();if(!id)return;DB=d.collection("data/users/"+id).doc("notes");pull()}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function title(n){return n.d[T[n.type].tt]||"Başlıksız "+T[n.type].n.toLowerCase()}
function parseDur(s){const m=String(s).trim().toLowerCase().match(/^(\d+)\s*(saat|sa|gün|gun|g|hafta|h)?/);if(!m)return null;const k=+m[1],u=m[2]||"gün";return k*(/^(saat|sa)$/.test(u)?1:/^(hafta|h)$/.test(u)?168:24)*3600000}
function dueInfo(ts){const d=ts-Date.now(),a=Math.abs(d),g=Math.floor(a/864e5),h=Math.floor(a%864e5/36e5),m=Math.floor(a%36e5/6e4),s=Math.floor(a%6e4/1e3),p=x=>String(x).padStart(2,"0"),t=(g?g+"g ":"")+p(h)+":"+p(m)+":"+p(s);return d<0?["late","−"+t]:[d<864e5?"soon":"",t]}
function rowH(n,tag,nc){let sub=T[n.type].n+(tag?" · arşiv":"");
if(n.type==="strateji"&&!nc){const c=S.filter(x=>x.link===n.id).length;if(c)sub+=" · "+c+" proje"}
if(n.type==="proje"){const a=n.d.tasks||[];sub+=" · "+a.filter(t=>t.done).length+"/"+a.length+" görev"}
const pgs=n.type==="kitap"&&(n.d.sayfa||n.d.toplam)?'<span class="due">'+esc(n.d.sayfa||0)+' / '+esc(n.d.toplam||"?")+'</span>':'';
return '<div class="row nt"><span class="ic">'+T[n.type].i+'</span><div class="grow"><div>'+esc(title(n))+'</div><small>'+sub+'</small></div>'+pgs+'<span class="acts"><span class="x" onclick="openN(\''+n.id+'\')">✎</span><span class="x" onclick="delN(\''+n.id+'\')">✕</span></span></div>'}
function pager(tot,p,fn){const m=Math.ceil(tot/PER);if(m<=1)return"";return '<div class="pg2"><button class="btn" '+(p<=0?"disabled":"")+' onclick="'+fn+'(-1)">‹</button><span>'+(p+1)+' / '+m+'</span><button class="btn" '+(p>=m-1?"disabled":"")+' onclick="'+fn+'(1)">›</button></div>'}
function mig(n){if(n.type==="kisi"){n.type="strateji";const d=n.d||{};n.d={hedef:d.ad,adim:d.ozellik,plan:d.plan}}return n}
function links(){const c=S.filter(x=>x.link===cur.id);return c.map(p=>{const a=p.d.tasks||[],dn=a.filter(t=>t.done).length;return '<div class="row" onclick="openN(\''+p.id+'\')"><span class="ic">🚀</span><div class="grow"><div>'+esc(title(p))+'</div><small>'+dn+'/'+a.length+' görev</small></div></div>'}).join("")+'<button class="btn" onclick="newLinked()">+ Bağlantılı proje oluştur</button>'}
function newLinked(){const p={id:"n"+Date.now(),type:"proje",d:{ad:cur.d.hedef||"",tasks:[]},u:Date.now(),link:cur.id};S.push(p);save();openN(p.id)}
function pin(){const v=!cur.pin;S.forEach(x=>delete x.pin);if(v)cur.pin=true;cur.u=Date.now();save();edit()}
function back(){const l=cur&&cur.link;if(cur&&isEmpty(cur)){S=S.filter(n=>n!==cur);save()}const p=l&&S.find(x=>x.id===l);if(p){cur=p;edit()}else home()}
function dlg(h){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99";o.innerHTML='<div style="background:var(--card);border:1px solid var(--bo);border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:90%;overflow:auto">'+h+'</div>';document.body.appendChild(o);return o}
function backup(){const d=JSON.stringify(S,null,1),o=dlg('<div style="margin-bottom:10px">⬇ Yedek</div><textarea id="bk" readonly style="min-height:140px;font-size:12px">'+esc(d)+'</textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap"><button class="btn" id="bk1">Kopyala</button><button class="btn" id="bk2">Dosya indir</button><button class="btn a" id="bk3">Kapat</button></div><div class="sync" id="bkm"></div>'),m=t=>{o.querySelector("#bkm").textContent=t};
o.querySelector("#bk3").onclick=()=>o.remove();
o.querySelector("#bk1").onclick=async()=>{const t=o.querySelector("#bk");try{await navigator.clipboard.writeText(d);m("Kopyalandı ✓")}catch(e){t.focus();t.select();try{document.execCommand("copy");m("Kopyalandı ✓")}catch(e2){m("Metni seçip elle kopyala")}}};
o.querySelector("#bk2").onclick=async()=>{try{if(window.claude){const dl=await claude.use("downloads");if(dl){await dl.save({filename:"anubis-yedek.json",data:d});m("İndirildi ✓");return}}}catch(e){if(e&&e.code==="declined")return}
try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:"application/json"}));a.download="anubis-yedek.json";document.body.appendChild(a);a.click();a.remove();m("İndirme başlatıldı")}catch(e){m("İndirilemedi, Kopyala'yı kullan")}}}
function importText(t,m){try{const a=JSON.parse(t);if(!Array.isArray(a))throw 0;let c=0;a.map(mig).forEach(x=>{if(!x||!x.id||!T[x.type])return;const i=S.findIndex(y=>y.id===x.id);if(i<0){S.push(x);c++}else if(x.u>S[i].u)S[i]=x});save();m(c+" yeni not eklendi, yedek birleştirildi ✓");if(!cur)home()}catch(e){m("Okunamadı. Anubis yedeğini (.json) yapıştır ya da seç.")}}
function importBox(){const o=dlg('<div style="margin-bottom:10px">⬆ İçe aktar</div><textarea id="im" placeholder="Yedek metnini buraya yapıştır…" style="min-height:120px;font-size:12px"></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap"><button class="btn" id="im1">Dosya seç</button><button class="btn" id="im2">Aktar</button><button class="btn a" id="im3">Kapat</button></div><input type="file" id="imf" accept=".json,.txt,application/json,text/plain" hidden><div class="sync" id="imm"></div>'),m=t=>{o.querySelector("#imm").textContent=t};
o.querySelector("#im3").onclick=()=>o.remove();
o.querySelector("#im1").onclick=()=>o.querySelector("#imf").click();
o.querySelector("#imf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(r.result,m);r.onerror=()=>m("Dosya okunamadı");r.readAsText(f);e.target.value=""};
o.querySelector("#im2").onclick=()=>{const v=o.querySelector("#im").value.trim();if(!v){m("Önce yedek metnini yapıştır");return}importText(v,m)}}
function isEmpty(n){if(S.some(x=>x.link===n.id))return false;return T[n.type].f.every(([k,,ty])=>{const v=n.d[k];if(ty==="stars")return !v;if(ty==="quotes")return !(v||[]).some(x=>String(x).trim());if(ty==="tasks")return !(v||[]).length;return !String(v==null?"":v).trim()})}
function ask(t){return new Promise(r=>{const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99";o.innerHTML='<div style="background:var(--card);border:1px solid var(--bo);border-radius:16px;padding:18px;max-width:320px;width:100%"><div style="margin-bottom:14px">'+esc(t)+'</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-v="0">Vazgeç</button><button class="btn a" data-v="1">Evet</button></div></div>';o.onclick=e=>{const v=e.target.dataset.v;if(v===undefined&&e.target!==o)return;o.remove();r(v==="1")};document.body.appendChild(o)})}
async function delN(id){const n=S.find(x=>x.id===id);if(!n||!await ask("Bu not silinsin mi?"))return;S.forEach(x=>{if(x.link===id)delete x.link});S=S.filter(x=>x!==n);save();if(document.getElementById("bd"))home();else arsiv()}
function togS(){const e=document.getElementById("qs");if(!e)return;const v=e.style.display==="none";e.style.display=v?"block":"none";if(v)e.focus();else{e.value="";q="";pg=0;body()}}
function blk(t,i){return '<section class="blk"><h2>'+t+'</h2>'+i+'</section>'}
function home(){if(cur&&isEmpty(cur)){S=S.filter(n=>n!==cur);save()}cur=null;
app.innerHTML='<div class="top"><h1>𓃥 <span>Anubis</span></h1><div class="tb"><button class="btn" onclick="togS()">🔍 ('+S.length+')</button><button class="btn" onclick="arsiv()">🗂 ('+S.filter(n=>n.a).length+')</button></div></div><input type="text" id="qs" placeholder="Tüm notlarda ara…" value="'+esc(q)+'" style="display:'+(q?'block':'none')+'"><div id="bd"></div>';
document.getElementById("qs").addEventListener("input",e=>{q=e.target.value;pg=0;body()});body()}
function body(){const el=document.getElementById("bd");if(!el)return;const k=q.trim().toLocaleLowerCase("tr");
if(k){const r=S.filter(n=>(JSON.stringify(n.d)+T[n.type].n).toLocaleLowerCase("tr").includes(k)).sort((a,b)=>b.u-a.u);
el.innerHTML='<h2>Sonuçlar ('+r.length+')</h2>'+(r.length?r.map(n=>rowH(n,n.a)).join(""):'<div class="empty">Eşleşen not yok.</div>');return}
const up=[];S.filter(n=>n.type==="proje"&&!n.a).forEach(n=>(n.d.tasks||[]).forEach(t=>{if(!t.done)up.push({t,p:n})}));up.sort((a,b)=>a.t.due-b.t.due);
const lt=ty=>S.filter(n=>!n.a&&n.type===ty).sort((a,b)=>b.u-a.u)[0];
const gl=[["🎯 Güncel strateji",S.find(n=>n.pin&&!n.a&&n.type==="strateji")||lt("strateji")],["💡 Güncel blog notu",lt("blog")],["📖 Güncel kitap",lt("kitap")]].filter(x=>x[1]);
let h=gl.length?blk("Güncel",gl.map(([l,n])=>'<small class="lb">'+l+'</small>'+rowH(n,0,1)).join("")):"";
h+=blk("Bugün ve yaklaşanlar",up.length?up.slice(0,5).map(({t,p})=>{const[c,l]=dueInfo(t.due);return '<div class="row" onclick="openN(\''+p.id+'\')"><div class="grow"><div>'+esc(t.t)+'</div><small style="color:var(--rd)">['+esc(p.d.ad||"Proje")+']</small></div><span class="due '+c+'" data-ts="'+t.due+'">'+l+'</span></div>'}).join(""):'<div class="empty">Bekleyen görev yok. Bir proje başlat.</div>');
h+=blk("Ne yazmak istiyorsun?",'<div class="grid">'+Object.keys(T).map(k=>'<div class="tile'+(k==="proje"?" p":"")+'" onclick="newN(\''+k+'\')"><b>'+T[k].i+'</b>'+T[k].n+'</div>').join("")+'</div>');
const r=S.filter(n=>!n.a&&(!hf||n.type===hf)).sort((a,b)=>b.u-a.u),m=Math.max(0,Math.ceil(r.length/PER)-1);if(pg>m)pg=m;
h+=blk("Son notlar",hchips()+(r.length?r.slice(pg*PER,pg*PER+PER).map(n=>rowH(n)).join("")+pager(r.length,pg,"goP"):'<div class="empty">Henüz not yok.</div>'));
h+='<div style="display:flex;gap:8px"><button class="btn grow" onclick="backup()">⬇ Dışa aktar</button><button class="btn grow" onclick="importBox()">⬆ İçe aktar</button></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn grow" onclick="cloudSave()">☁ Buluta kaydet</button><button class="btn grow" onclick="cloudLoad()">☁ Buluttan yükle</button></div><div class="sync" id="sy">'+syncT+'</div>';
el.innerHTML=h}
function goP(d){pg+=d;body()}
