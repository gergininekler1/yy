<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotLab — Kişisel Not Aracı</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1f2430;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --border: #2a3040;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .app { display: grid; grid-template-columns: 330px 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 900; color: #0b0d12;
  }
  .search {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 10px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: .15s;
  }
  .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    border: none; color: white;
  }
  .btn.small { padding: 7px 9px; font-size: 12px; }
  .notes { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .note-card {
    border: 1px solid var(--border); background: var(--panel-2);
    border-radius: 12px; padding: 12px; cursor: pointer; transition: .15s;
  }
  .note-card:hover { border-color: var(--accent); }
  .note-card.active { border-color: var(--accent); background: #242a38; }
  .note-card.pinned { border-left: 3px solid var(--accent-2); }
  .note-title { font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-preview {
    color: var(--muted); font-size: 13px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .note-meta { margin-top: 8px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .editor { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .editor-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #title {
    flex: 1; min-width: 220px; font-size: 24px; font-weight: 800;
    background: transparent; border: none; color: var(--text); outline: none;
  }
  #content {
    flex: 1; width: 100%; min-height: 55vh; resize: none;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 14px; padding: 18px; font-size: 16px; line-height: 1.65; outline: none;
  }
  #content:focus { border-color: var(--accent); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status { margin-left: auto; color: var(--muted); font-size: 12px; }
  body.focus .sidebar, body.focus .editor-head, body.focus .toolbar { display: none; }
  body.focus .app { grid-template-columns: 1fr; }
  body.focus .editor { padding: 8vh 10vw; }
  body.focus #content { background: transparent; border: none; font-size: 19px; min-height: 70vh; }
  .inspiration {
    border: 1px dashed var(--accent); background: rgba(124, 92, 255, .08);
    border-radius: 14px; padding: 14px;
  }
  .inspiration h4 { margin: 0 0 6px; font-size: 13px; color: var(--accent-2); }
  .inspiration p { margin: 0; color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--panel-2);
    border: 1px solid #34d399; color: var(--text); padding: 12px 16px;
    border-radius: 12px; opacity: 0; transform: translateY(10px); transition: .25s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    .notes { max-height: 280px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      NotLab
    </div>

    <input id="search" class="search" placeholder="Notlarda ara…">
    <button class="btn primary" onclick="createNote()">+ Yeni Not</button>
    <div id="notes" class="notes"></div>
    <button class="btn small" onclick="exportNotes()">⬇ Notları dışa aktar</button>
  </aside>

  <main class="editor">
    <div class="editor-head">
      <input id="title" placeholder="Not başlığı">
      <button class="btn small" onclick="togglePin()">📌 Sabitle</button>
      <button class="btn small" onclick="toggleFocus()">🎯 Focus Mod</button>
      <button class="btn small" onclick="deleteNote()">🗑 Sil</button>
    </div>

    <div id="inspiration" class="inspiration" style="display:none">
      <h4>💡 İlham Notu</h4>
      <p id="inspirationText"></p>
    </div>

    <textarea id="content" placeholder="Fikrini buraya yaz…"></textarea>

    <div class="toolbar">
      <button class="btn small" onclick="showInspiration()">🎲 İlham Notu</button>
      <button class="btn small" onclick="insertTimestamp()">🕒 Zaman damgası</button>
      <button class="btn small" onclick="saveNote(true)">💾 Kaydet</button>
      <span class="status" id="status">Hazır</span>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
let notes = JSON.parse(localStorage.getItem("notlab_notes") || "[]");
let activeId = null;
let saveTimer = null;

const $ = id => document.getElementById(id);

function save() {
  localStorage.setItem("notlab_notes", JSON.stringify(notes));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function createNote() {
  const note = {
    id: uid(),
    title: "Yeni not",
    content: "",
    pinned: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  notes.unshift(note);
  activeId = note.id;
  save();
  render();
  $("title").focus();
}

function getActive() {
  return notes.find(n => n.id === activeId);
}

function render() {
  const query = $("search").value.toLowerCase().trim();
  const list = notes
    .filter(n =>
      !query ||
      n.title.toLowerCase().includes(query) ||
      n.content.toLowerCase().includes(query)
    )
    .sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));

  $("notes").innerHTML = list.length ? "" : `<div class="empty">Henüz not yok.</div>`;

  list.forEach(note => {
    const div = document.createElement("div");
    div.className = "note-card" + (note.id === activeId ? " active" : "") + (note.pinned ? " pinned" : "");
    div.innerHTML = `
      <div class="note-title">${escapeHtml(note.title || "Başlıksız")}</div>
      <div class="note-preview">${escapeHtml(note.content.slice(0, 120) || "Boş not")}</div>
      <div class="note-meta">
        <span>${new Date(note.updatedAt).toLocaleString("tr-TR")}</span>
        <span>${note.pinned ? "📌" : ""}</span>
      </div>
    `;
    div.onclick = () => {
      activeId = note.id;
      render();
    };
    $("notes").appendChild(div);
  });

  const active = getActive();
  $("title").value = active ? active.title : "";
  $("content").value = active ? active.content : "";
  updateStatus();
}

function escapeHtml(text) {
  return text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

function updateStatus() {
  const note = getActive();
  if (!note) {
    $("status").textContent = "Not seçili değil";
    return;
  }
  const words = note.content.trim().split(/s+/).filter(Boolean).length;
  $("status").textContent = `${words} kelime • ${note.content.length} karakter`;
}

function saveNote(showToast = false) {
  const note = getActive();
  if (!note) return;
  note.title = $("title").value;
  note.content = $("content").value;
  note.updatedAt = Date.now();
  save();
  render();
  if (showToast) showToastMessage("Not kaydedildi ✅");
}

function autoSave() {
  clearTimeout(saveTimer);
  $("status").textContent = "Kaydediliyor…";
  saveTimer = setTimeout(() => {
    saveNote();
    $("status").textContent = "Otomatik kaydedildi";
  }, 700);
}

function deleteNote() {
  const note = getActive();
  if (!note) return;
  if (!confirm("Bu notu silmek istediğine emin misin?")) return;
  notes = notes.filter(n => n.id !== note.id);
  activeId = notes[0]?.id || null;
  save();
  render();
  showToastMessage("Not silindi 🗑");
}

function togglePin() {
  const note = getActive();
  if (!note) return;
  note.pinned = !note.pinned;
  save();
  render();
}

function toggleFocus() {
  document.body.classList.toggle("focus");
  const focused = document.body.classList.contains("focus");
  showToastMessage(focused ? "Focus Mod açık 🎯" : "Focus Mod kapalı");
  if (focused) $("content").focus();
}

function showInspiration() {
  const others = notes.filter(n => n.id !== activeId && n.content.trim());
  const box = $("inspiration");
  if (!others.length) {
    $("inspirationText").textContent = "İlham için önce birkaç not oluştur.";
    box.style.display = "block";
    return;
  }
  const random = others[Math.floor(Math.random() * others.length)];
  const preview = random.content.trim().split("
")[0].slice(0, 180);
  $("inspirationText").innerHTML =
    `<strong>${escapeHtml(random.title || "Başlıksız")}</strong><br>${escapeHtml(preview)}…`;
  box.style.display = "block";
}

function insertTimestamp() {
  const area = $("content");
  const now = new Date().toLocaleString("tr-TR");
  const start = area.selectionStart;
  const text = area.value;
  area.value = text.slice(0, start) + `
[${now}] ` + text.slice(start);
  area.focus();
  autoSave();
}

function exportNotes() {
  const blob = new Blob([JSON.stringify(notes, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "notlab-notlar.json";
  link.click();
  showToastMessage("Notlar dışa aktarıldı ⬇");
}

function showToastMessage(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1800);
}

$("title").addEventListener("input", autoSave);
$("content").addEventListener("input", autoSave);
$("search").addEventListener("input", render);

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    saveNote(true);
  }
  if (e.key === "Escape" && document.body.classList.contains("focus")) {
    toggleFocus();
  }
});

if (!notes.length) createNote();
render();
</script>

</body>
</html>
